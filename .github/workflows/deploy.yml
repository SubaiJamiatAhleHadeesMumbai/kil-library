name: 🚀 Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🔄 Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting Deployment on VPS..."
            
            # 1. Navigate to Project Directory
            cd /root/kil-library || cd ~/kil-library
            
            # 2. Pull Latest Code from GitHub
            echo "📦 Pulling latest changes from main branch..."
            git pull origin main
            
            # 3. Build and Start Containers
            echo "🐳 Building & restarting Docker containers..."
            docker compose up -d --build --remove-orphans
            
            # 4. Optional: Run Database Table Check / Seed
            echo "🗄️ Checking database schema..."
            docker compose exec -T backend python create_tables.py || true
            docker compose exec -T backend python setup_admin.py || true
            docker compose exec -T backend python scripts/seed_data.py || true
            
            # 5. Clean up old unused Docker images
            echo "🧹 Cleaning unused docker images..."
            docker image prune -f
            
            echo "✅ Deployment Completed Successfully!"
