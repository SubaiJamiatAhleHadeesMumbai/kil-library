name: 🚀 Deploy to Hostinger VPS & Sync Master

on:
  push:
    branches:
      - main

jobs:
  sync-and-deploy:
    name: 🔄 Sync Master & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔀 Auto-sync main to master branch
        run: |
          echo "🔄 Syncing main branch to master branch..."
          git push origin HEAD:refs/heads/master --force
          echo "✅ Master branch is now 100% synchronized with main!"

      - name: 🚀 Deploy via Native SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '178.16.139.231' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          echo "🔑 Preparing SSH Key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write private key with normalized unix line breaks and trailing newline
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Disable strict host checking for automated deployment
          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n\tServerAliveInterval 15\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          echo "🌐 Testing Connection to $VPS_USER@$VPS_HOST on port $VPS_PORT..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o ConnectTimeout=60 "$VPS_USER@$VPS_HOST" << 'EOF' 2>&1 | tee /tmp/vps_output.txt
            echo "🚀 Successfully Connected to VPS!"
            cd /root/kil-library || cd ~/kil-library || { echo "Directory not found"; exit 1; }
            echo "📍 Current Directory: $(pwd)"
            echo "📦 Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main
            echo "📌 Current Commit on VPS: $(git log -1 --oneline)"

            echo "🔍 Testing Nginx Configuration..."
            nginx -T 2>&1 | grep -E "server_name|listen|proxy_pass|root " || true

            echo "📊 Docker Status BEFORE:"
            docker compose ps -a || true
            docker compose logs --tail=50 backend || true

            echo "🐳 Stopping containers cleanly..."
            docker compose down --remove-orphans || true

            echo "🐳 Building frontend and backend with --no-cache to force 100% fresh builds..."
            docker compose build --no-cache frontend backend
            echo "🐳 Starting containers..."
            docker compose up -d --remove-orphans

            echo "⏳ Waiting 10 seconds for containers to settle..."
            sleep 10

            echo "📁 Syncing static assets and homepage settings into backend..."
            docker compose exec -T backend mkdir -p /app/static/uploads /app/static/images || true
            docker compose cp ./library_backend/static/uploads/. backend:/app/static/uploads/ || true
            docker compose cp ./library_backend/static/images/. backend:/app/static/images/ || true
            docker compose cp ./library_backend/static/homepage_settings.json backend:/app/static/homepage_settings.json || true

            echo "🚀 Syncing fresh frontend build to all potential host Nginx webroots..."
            for WEBROOT in /var/www/html /var/www/kil-library /var/www/kil-library/library-frontend/dist /root/kil-library/library-frontend/dist; do
              if [ -d "$WEBROOT" ]; then
                echo "Syncing build into $WEBROOT..."
                docker compose cp frontend:/usr/share/nginx/html/. "$WEBROOT/" || true
              fi
            done

            echo "🔄 Reloading host Nginx and clearing cache..."
            rm -rf /var/cache/nginx/* 2>/dev/null || true
            systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || true

            echo "🗄️ Checking database schema..."
            docker compose exec -T backend python create_tables.py || true
            docker compose exec -T backend python setup_admin.py || true

            echo "📊 Docker Status AFTER:"
            docker compose ps -a || true

            echo "📋 Backend Logs AFTER:"
            docker compose logs --tail=100 backend || true

            echo "📋 DB Logs AFTER:"
            docker compose logs --tail=50 db || true

            echo "🌐 Testing Local Backend API on VPS..."
            curl -sv http://127.0.0.1:8000/docs || true
            curl -sv http://127.0.0.1:8000/api/settings/homepage-settings || true

            echo "🧹 Cleaning unused docker images..."
            docker image prune -f
            echo "✅ Deployment Completed Successfully!"
          EOF

      - name: 📝 Commit VPS Debug Log to Repo Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vps-diagnostics
          git rm -rf . || true
          if [ -f /tmp/vps_output.txt ]; then
            cp /tmp/vps_output.txt vps_diagnostics.txt
          else
            echo "No log generated" > vps_diagnostics.txt
          fi
          git add vps_diagnostics.txt
          git commit -m "diagnostics: vps deployment log [skip ci]" || exit 0
          git push origin vps-diagnostics --force

