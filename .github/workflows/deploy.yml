name: 🚀 P52 Server Deployment & Cloud Build Verification

on:
  push:
    branches:
      - main

jobs:
  p52-deploy-verify:
    name: ⚡ Cloud Build & Lenovo P52 Auto-Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: library-frontend/package-lock.json

      - name: 📦 Fast Cloud Build
        working-directory: ./library-frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: 🚀 Deployment Status
        run: |
          echo "=========================================================="
          echo "🚀 KOKAN ISLAMIC LIBRARY - LENOVO P52 PRODUCTION SERVER"
          echo "=========================================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Production Server: Lenovo ThinkPad P52 (Local NVMe Dedicated Server)"
          echo "Live Domain: https://www.ahlehadeeskokan.com"
          echo "Auto-Deploy Mechanism: kil-autodeploy.service (P52 Watcher Daemon)"
          echo "=========================================================="
          echo "✅ Cloud build passed with 0 errors!"
          echo "⚡ P52 Server is now syncing and activating updated build."
