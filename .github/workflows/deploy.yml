name: 🚀 Deploy to Hostinger VPS & Sync Master

on:
  push:
    branches:
      - main

jobs:
  sync-and-deploy:
    name: 🔄 Sync Master & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔀 Auto-sync main to master branch
        run: |
          echo "🔄 Syncing main branch to master branch..."
          git push origin HEAD:refs/heads/master --force
          echo "✅ Master branch is now 100% synchronized with main!"

      - name: 🌐 Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 600s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "🚀 Starting Deployment on VPS..."
            
            # 1. Navigate to Project Directory
            cd /root/kil-library || cd ~/kil-library
            
            # 2. Pull Latest Code from GitHub
            echo "📦 Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Build and Start Containers
            echo "🐳 Building & restarting Docker containers..."
            docker compose up -d --build --remove-orphans
            
            # 4. Optional: Run Database Table Check / Seed
            echo "🗄️ Checking database schema..."
            docker compose exec -T backend python create_tables.py || true
            docker compose exec -T backend python setup_admin.py || true
            
            # 5. Ensure Host Nginx allows up to 500MB file uploads
            echo "🔧 Configuring Nginx upload limit to 500M..."
            if [ -f /etc/nginx/nginx.conf ]; then
              sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf || true
              sed -i '/http {/a \    client_max_body_size 500M;' /etc/nginx/nginx.conf || true
              nginx -t && nginx -s reload || true
            fi

            # 6. Clean up old unused Docker images
            echo "🧹 Cleaning unused docker images..."
            docker image prune -f
            
            echo "✅ Deployment Completed Successfully!"
