      /* Clean Naskh Headings & Titles for High Legibility (No diagonal stepping) */
      .urdu-title,
      .font-urdu-heading,
      html[lang="ur"] h1, html[lang="ur"] h2, html[lang="ur"] h3,
      body.font-urdu h1, body.font-urdu h2, body.font-urdu h3,

        line-height: 1.5;
      }

      /* Optional Nastaliq Calligraphy Utility when explicitly needed */
      .font-nastaliq,
      .font-gulzar {
        font-family: 'Gulzar', 'Noto Nastaliq Urdu', 'Mehr Nastaliq Web', serif;
        line-height: 2.1;
      }

      /* Explicit Noto Naskh Arabic for Body, Navigation, Buttons */
      .font-naskh,
      [lang="ur"] p, [lang="ur"] span, [lang="ur"] a, [lang="ur"] button, [lang="ur"] input,
      [dir="rtl"] p, [dir="rtl"] span, [dir="rtl"] a, [dir="rtl"] button, [dir="rtl"] input {
        font-family: 'Noto Naskh Arabic', system-ui, sans-serif;
      }

      /* Arabic Quran & Hadith in Amiri */
      body.font-arabic, .font-arabic, .arabic-text, [lang="ar"], [lang="ar"] * {

      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .skiptranslate > iframe {
        display: none !important;
      }
      #google_translate_element {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
      .goog-te-gadget {
        display: none !important;
      }

    <!-- Early Language & Direction Initializer (Defaults to Authentic Urdu RTL) -->
    <script>
      (function() {
        try {
          var isAdm = window.location.pathname.startsWith('/admin');
          if (isAdm) {
            document.documentElement.dir = 'ltr';
            document.documentElement.lang = 'en';
            return;
          }
          var saved = localStorage.getItem('kil_language');
          if (saved === 'en') {
            document.documentElement.dir = 'ltr';
            document.documentElement.lang = 'en';
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + window.location.hostname + ';';
          } else {
            // Default is Urdu RTL with authentic Islamic typography
            var activeLang = (saved === 'ar' ? 'ar' : 'ur');
            document.documentElement.dir = 'rtl';
            document.documentElement.lang = activeLang;
            var val = '/en/' + activeLang;
            document.cookie = 'googtrans=' + val + '; path=/;';
            document.cookie = 'googtrans=' + val + '; path=/; domain=' + window.location.hostname + ';';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Translate Script (Restricted to Arabic, English, Urdu) -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        var isAdm = window.location.pathname.startsWith('/admin');
        if (isAdm) return;

        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'ar,en,ur',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');

        // Only sync if user EXPLICITLY selected ur or ar before
        setTimeout(function() {
          var saved = localStorage.getItem('kil_language');
          if (saved && (saved === 'ur' || saved === 'ar')) {
            var select = document.querySelector('.goog-te-combo');
            if (select && select.value !== saved) {
              select.value = saved;
              select.dispatchEvent(new Event('change', { bubbles: true }));
            }
          }
        }, 300);
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
